[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppt-agent-domain"
version = "0.1.0"
description = "PPT-specific tools and versioned assets for PPT Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF>=1.24.0",
  "Pillow>=10.0",
  "pydantic>=2.8",
  "ppt-agent-harness",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ppt_agent_domain = ["presentation/runtime/*.mjs", "presentation/runtime/*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../../agent_harness/src"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
