[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ppt-agent-harness"
version = "0.1.0"
description = "Model-driven agent runtime and control plane for PPT Agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "PPT Agent Team" }]
dependencies = ["pydantic>=2.8"]

[project.optional-dependencies]
openai = ["openai>=1.50.0"]
anthropic = ["anthropic>=0.40.0"]
env = ["python-dotenv>=1.0.0"]
dev = ["pytest>=8.0", "ruff>=0.8", "mypy>=1.13"]
all = [
  "openai>=1.50.0",
  "anthropic>=0.40.0",
  "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_harness = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
